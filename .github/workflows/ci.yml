name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  database:
    name: Datenbanktests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Läuft erst, wenn `supabase init` ausgeführt wurde und config.toml im Repo liegt.
      - id: check
        run: echo "ready=$([ -f supabase/config.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - if: steps.check.outputs.ready == 'true'
        run: supabase db start

      - if: steps.check.outputs.ready == 'true'
        run: supabase test db

  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Läuft erst, wenn das App-Gerüst mit package.json im Repo liegt.
      - id: check
        run: echo "ready=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.check.outputs.ready == 'true'
        run: npm ci

      - if: steps.check.outputs.ready == 'true'
        run: npm run typecheck

      - if: steps.check.outputs.ready == 'true'
        run: npm run lint

      - if: steps.check.outputs.ready == 'true'
        run: npm test

      - if: steps.check.outputs.ready == 'true'
        run: npm run build
        env:
          # Der Build braucht nur gültig geformte Werte, keine echte Verbindung.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder

  e2e:
    name: Ende-zu-Ende
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # Nur, was die App in den Abläufen braucht: Datenbank, Auth, API und Echtzeit.
      - run: supabase start -x studio,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor

      # Adressen und Schlüssel der lokalen Supabase für Build, App und Tests
      - run: >
          supabase status -o env
          --override-name api.url=NEXT_PUBLIC_SUPABASE_URL
          --override-name auth.publishable_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          --override-name auth.secret_key=SUPABASE_SECRET_KEY
          | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|SUPABASE_SECRET_KEY|DB_URL)='
          | tr -d '"' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
